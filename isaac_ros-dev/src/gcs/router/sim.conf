# mavlink-router, SIM: the autopilot SITL's MAVLink link (it sends to UDP 14540) split to every sink. The SITL is reached back
# through the same socket (Server mode answers the address packets came from).
#   MAVROS (host_all.launch.py router:=1)  fcu_url udp://:14640@
#   ground station dashboard (src/gcs)     udpin 14650
#   QGroundControl on the Lenovo           10.42.0.1:14550
[General]
TcpServerPort = 5760
ReportStats = false

[UdpEndpoint px4_sitl]
Mode = Server
Address = 0.0.0.0
Port = 14540

[UdpEndpoint mavros]
Mode = Normal
Address = 127.0.0.1
Port = 14640

[UdpEndpoint gcs_dashboard]
Mode = Normal
Address = 127.0.0.1
Port = 14650

[UdpEndpoint lenovo_qgc]
Mode = Normal
Address = 10.42.0.1
Port = 14550

# onboard/mav_agent.py (radio commands -> this dashboard), as in the onboard router: it keeps working in a sim run
[UdpEndpoint mav_agent]
Mode = Normal
Address = 127.0.0.1
Port = 14660

# QGC from any address (it sends first)
[UdpEndpoint qgc_any]
Mode = Server
Address = 0.0.0.0
Port = 14551
