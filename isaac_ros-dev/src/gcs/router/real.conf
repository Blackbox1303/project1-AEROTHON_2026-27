# mavlink-router, REAL DRONE: the flight controller on the Jetson's serial port (USB: /dev/ttyACM0; Pixhawk TELEM2 on
# the Jetson UART: /dev/ttyTHS1 - set Device / Baud to the wiring, PX4: MAV_1_CONFIG TELEM 2, SER_TEL2_BAUD 921600)
# split to the same sinks as sim.conf.
[General]
TcpServerPort = 5760
ReportStats = false

[UartEndpoint fcu]
Device = /dev/ttyACM0
Baud = 921600

[UdpEndpoint mavros]
Mode = Normal
Address = 127.0.0.1
Port = 14640

[UdpEndpoint gcs_dashboard]
Mode = Normal
Address = 127.0.0.1
Port = 14650

# the ArUco delivery dashboard (gcs_server.py --port 8084 --marker aruco)
[UdpEndpoint gcs_aruco]
Mode = Normal
Address = 127.0.0.1
Port = 14651

[UdpEndpoint lenovo_qgc]
Mode = Normal
Address = 10.42.0.1
Port = 14550
