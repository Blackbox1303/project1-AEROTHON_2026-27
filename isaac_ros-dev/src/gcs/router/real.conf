# mavlink-router, REAL DRONE: the Pixhawk's USB port 1 (/dev/ttyACM0) split to the same sinks as sim.conf. (TELEM2 is
# the ELRS receiver, the SiK radio is on the Pixhawk's GPS2: no Jetson UART link.)
[General]
TcpServerPort = 5760
ReportStats = false

[UartEndpoint fcu]
Device = /dev/ttyACM0
Baud = 921600

[UdpEndpoint mavros]
Mode = Normal
Address = 127.0.0.1
Port = 14640

[UdpEndpoint gcs_dashboard]
Mode = Normal
Address = 127.0.0.1
Port = 14650

# the ArUco delivery dashboard (gcs_server.py --port 8084 --marker aruco)
[UdpEndpoint gcs_aruco]
Mode = Normal
Address = 127.0.0.1
Port = 14651

[UdpEndpoint lenovo_qgc]
Mode = Normal
Address = 10.42.0.1
Port = 14550
