# GENERATED by sim/rig_from_model.py from the PX4-Autopilot drone models - don't edit by hand.
#   IMU:    /home/szyfrowac/PX4-Autopilot/Tools/simulation/gz/models/x500_base/model.sdf  (imu_sensor on base_link, 250 Hz)
#   camera: /home/szyfrowac/PX4-Autopilot/Tools/simulation/gz/models/x500_d435/model.sdf  (realsense mount ".12 0 .15 0 0 0")
# imu_link = PX4's IMU (x500 base_link); camera_link = the D435.
source: sim (PX4 x500_base + x500_d435 models)

imu_to_camera:
  translation: [0.12, 0.0, -0.09]
  rotation_xyzw: [0.0, 0.0, 0.0, 1.0]

# IMU stamps in sim come from PX4's own clock (= Gazebo sim time), but the samples lag the true motion
# by 4 ms (one 250 Hz sample; PX4 HIGHRES_IMU) - measured by tests/vio_frames_check.py, 2026-10-19
time_offset: -0.004

# From imu_sensor's per-sample Gaussian noise: density = stddev / sqrt(250 Hz).
# The gz IMU has no bias model, so the random walks are small fixed floors.
imu_noise:
  gyro_noise_density: 5.519e-05
  gyro_random_walk: 2.0e-05
  accel_noise_density: 4.339e-04
  accel_random_walk: 3.0e-03
  rate_hz: 200.0
